version: 2
updates:
  # Keeps the SHA-pinned workflow actions current. Python and npm dependencies
  # are updated deliberately (uv.lock, tests/web/package-lock.json) together
  # with sbom.cdx.json, so they are not managed here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
