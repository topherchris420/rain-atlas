name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run atlas skills validate skills
      - run: uv run pytest -m "not slow" -q

  acceptance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m slow -q
      - run: uv run atlas experiment run spectral-recovery --mode fixed --root atlas-data/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectral-recovery-report
          path: atlas-data/ci/reports/
