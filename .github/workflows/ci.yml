name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run atlas skills validate skills
      - run: uv run pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml

  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m slow -q
      - run: uv run atlas experiment run spectral-recovery --mode fixed --root atlas-data/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectral-recovery-report
          path: atlas-data/ci/reports/
