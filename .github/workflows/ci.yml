name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running checks; pushes
# to main always run to completion so every main commit has a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs (tag in the trailing comment).
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.11", "3.12"]
        include:
          - os: ubuntu-24.04
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy
      - run: uv run atlas skills validate skills
      - run: uv run pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml

  # The slow acceptance tests already run in every test job. This job drives
  # the documented CLI end to end and verifies each ledger it writes.
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run atlas experiment run spectral-recovery --mode fixed --root atlas-data/ci
      - run: uv run atlas ledger verify atlas-data/ci/ledger
      - run: uv run atlas experiment run synchronization --root atlas-data/sync --replicates 12
      - run: uv run atlas ledger verify atlas-data/sync/ledger
      - run: uv run atlas benchmark --root atlas-data/bench --trials 12
      - run: uv run atlas ledger verify atlas-data/bench/ledger
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: acceptance-evidence
          path: |
            atlas-data/ci/reports/
            atlas-data/sync/reports/
            atlas-data/sync/observatory/
            atlas-data/bench/benchmark.json
          if-no-files-found: warn

  offline-viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - run: npm ci --prefix tests/web
      - run: npm test --prefix tests/web
