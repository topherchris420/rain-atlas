name: release

# Two ways to publish version X.Y.Z, which must equal the package version and
# have release notes in docs/releases/vX.Y.Z.md:
#
# * push the tag vX.Y.Z; or
# * run this workflow manually on main ("Run workflow" on the Actions tab)
#   with the version. The GitHub release then creates the tag on the commit
#   that was built.
#
# The distributions are built once and checked as installed wheels. They are
# attached to a GitHub release and, only once that release exists, uploaded
# to PyPI with trusted publishing (OIDC; no stored token).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must equal the version in pyproject.toml), e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: The version, release notes and source branch are right
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::release ${TAG} does not match package version ${version}"; exit 1
          fi
          test -f "docs/releases/${TAG}.md" || { echo "::error::missing docs/releases/${TAG}.md"; exit 1; }
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::manual releases run from main, not ${GITHUB_REF}"; exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::tag ${TAG} already exists; it cannot be released again"; exit 1
            fi
          fi
      - name: Build the release distributions
        run: uv build --out-dir dist
      - name: Check exactly these files (twine check, clean install, CLI outside the checkout)
        run: uv run --no-project python scripts/check_package.py --dist dist
      - name: Checksums
        working-directory: dist
        run: sha256sum rain_atlas-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release (and, for a manual run, its tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            placement=(--verify-tag)
          else
            placement=(--target "${GITHUB_SHA}")
          fi
          gh release create "${TAG}" dist/* sbom.cdx.json \
            --title "R.A.I.N. ATLAS ${TAG}" \
            --notes-file "docs/releases/${TAG}.md" \
            "${placement[@]}"

  pypi:
    needs: [build, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/rain-atlas/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload only the distributions
        run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
