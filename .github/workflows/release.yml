name: release

# Pushing a tag vX.Y.Z publishes that version: the tag must equal the package
# version and have release notes in docs/releases/vX.Y.Z.md. The distributions
# are built once, checked as installed wheels, then attached to a GitHub
# release and uploaded to PyPI with trusted publishing (OIDC; no stored token).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: The tag names the package version and has release notes
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1
          fi
          test -f "docs/releases/${GITHUB_REF_NAME}.md" || { echo "::error::missing docs/releases/${GITHUB_REF_NAME}.md"; exit 1; }
      - name: Build the release distributions
        run: uv build --out-dir dist
      - name: Check exactly these files (twine check, clean install, CLI outside the checkout)
        run: uv run --no-project python scripts/check_package.py --dist dist
      - name: Checksums
        working-directory: dist
        run: sha256sum rain_atlas-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* sbom.cdx.json \
            --title "R.A.I.N. ATLAS ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --verify-tag

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/rain-atlas/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload only the distributions
        run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
