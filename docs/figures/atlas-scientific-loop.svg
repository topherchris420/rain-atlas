<text x="116" y="292" text-anchor="start" fill="#254446" font-size="25" font-family="Arial, sans-serif" font-weight="700">I. PREDICTION</text>
<text x="105" y="352" text-anchor="start" fill="#3f5c5a" font-size="21" font-family="Arial, sans-serif" font-weight="600">Lock the hypothesis first</text>
<g filter="url(#shadow)"><rect x="598" y="232" width="486" height="535" rx="21" fill="#ffffff" stroke="#d7e1dd" stroke-width="1.5"/></g>
<rect x="616" y="250" width="450" height="65" rx="12" fill="#f8eeec" stroke="none" stroke-width="1.5"/>
<text x="637" y="292" text-anchor="start" fill="#254446" font-size="25" font-family="Arial, sans-serif" font-weight="700">II. CONTRADICTION</text>
<text x="626" y="352" text-anchor="start" fill="#3f5c5a" font-size="21" font-family="Arial, sans-serif" font-weight="600">Inspect immutable observations</text>
