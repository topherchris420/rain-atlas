<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900" role="img" aria-labelledby="title desc"><title id="title">ATLAS Physical Scientist: prediction, contradiction and revision</title><desc id="desc">Three-stage conceptual software workflow: competing damped-oscillator models, a synthetic discrepancy against a precommitted prediction, and a held-out evaluation. Curves are mathematical illustrations, not recorded physical observations.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f9f7"/><stop offset="1" stop-color="#eff3ef"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3e5451" flood-opacity=".08"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#849e98"/></marker></defs><rect width="1680" height="900" fill="url(#bg)"/><rect x="42" y="34" width="1596" height="832" rx="28" fill="none" stroke="#c7d6cf" stroke-width="1.5"/>
<text x="80" y="86" text-anchor="start" fill="#0B5D63" font-size="19" font-family="Arial, sans-serif" font-weight="700">VERS3DYNAMICS / PHYSICAL SCIENTIST</text>
<text x="1600" y="86" text-anchor="end" fill="#6b817a" font-size="17" font-family="Arial, sans-serif" font-weight="600">FIGURE 02 / EXPERIMENT LOGIC</text>
<text x="84" y="157" text-anchor="start" fill="#293d3f" font-size="59" font-family="Georgia, serif" font-weight="400">A model can be rejected</text>
<text x="86" y="199" text-anchor="start" fill="#627a74" font-size="23" font-family="Arial, sans-serif" font-weight="400">Preregister → test → preserve the contradiction → predict again.</text>
