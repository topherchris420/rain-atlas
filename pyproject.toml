[project]
name = "rain-atlas"
version = "0.1.0"
description = "R.A.I.N. ATLAS: a local-first scientific instrument with executable skills, bounded execution and an append-only evidence ledger."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vers3Dynamics" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
atlas = "rain_atlas.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rain_atlas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end runs that start many skill processes",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/rain_atlas/science/resonance.py", "src/rain_atlas/science/uncertainty.py"]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
